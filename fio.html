<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fio banka — přihlášení</title>
  <style>
    html, body { margin: 0; min-height: 100%; font-family: Roboto, system-ui, sans-serif; background: #f4f6f8; color: #1a1a1a; }
    header { background: #003366; color: #fff; padding: 16px 20px; font-size: 18px; font-weight: 700; }
    main { padding: 24px 20px 48px; max-width: 420px; margin: 0 auto; }
    h1 { font-size: 22px; line-height: 28px; font-weight: 700; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 22px; color: #5c6670; margin: 0 0 20px; }
    label { display: block; font-size: 13px; margin: 0 0 6px; }
    input { width: 100%; box-sizing: border-box; height: 48px; border: 1px solid #c5cdd3; border-radius: 8px; padding: 0 12px; font: inherit; margin: 0 0 16px; }
    button { width: 100%; height: 48px; border: 0; border-radius: 8px; background: #003366; color: #fff; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <header>Fio banka</header>
  <main>
    <h1>Přihlášení do internetbankingu</h1>
    <p>Zadejte přihlašovací údaje ke svému účtu.</p>
    <label for="user">Uživatelské jméno</label>
    <input id="user" name="user" autocomplete="off" />
    <label for="pass">Heslo</label>
    <input id="pass" name="pass" type="password" autocomplete="off" />
    <button type="button">Přihlásit se</button>
  </main>
</body>
</html>
